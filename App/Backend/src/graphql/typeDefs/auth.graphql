type User {
  id: ID!
  email: String!
  name: String!
}

type AuthPayload {
  token: String!
  user: User!
}

type RegisterResponse {
  message: String!
  user: User!
}

input RegisterInput {
  email: String!
  password: String!
  name: String!
}

input LoginInput {
  email: String!
  password: String!
}

type Query {
  me: User!
  _empty: String
}

type Mutation {
  register(input: RegisterInput!): RegisterResponse!
  login(input: LoginInput!): AuthPayload!
}
